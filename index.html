<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e50914">

<title>D2</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
    touch-action:manipulation;
}

input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #333;
    background:#111;
    color:#fff;
    outline:none;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
}

.red{
    background:#e50914;
    color:#fff;
}

.dark{
    background:#191919;
    color:#fff;
    border:1px solid #333;
}

#setup{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:radial-gradient(circle,#390b0e,#080808 65%);
}

.setup{
    width:100%;
    max-width:400px;
    padding:30px 24px;
    background:#111;
    border:1px solid #292929;
    border-radius:22px;
    text-align:center;
}

.logo{
    width:85px;
    height:85px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 20px;
    border-radius:22px;
    background:#e50914;
    font-size:32px;
    font-weight:900;
}

.setup p{
    color:#888;
    margin:10px 0 22px;
    line-height:1.5;
}

#app{
    display:none;
}

.top{
    height:64px;
    display:flex;
    align-items:center;
    padding:0 18px;
    background:#0d0d0d;
    border-bottom:1px solid #222;
}

.logo-small{
    color:#e50914;
    font-size:25px;
    font-weight:900;
}

.nav{
    display:flex;
    gap:5px;
    margin-left:30px;
}

.nav button{
    background:transparent;
    color:#999;
}

.nav button:hover{
    background:#191919;
    color:#fff;
}

.user{
    margin-left:auto;
    color:#aaa;
}

.layout{
    display:flex;
    min-height:calc(100vh - 64px);
}

.side{
    width:230px;
    padding:18px;
    background:#0c0c0c;
    border-right:1px solid #222;
}

.side h4{
    color:#555;
    font-size:11px;
    margin:15px 0 8px;
}

.side button{
    width:100%;
    text-align:left;
    margin-bottom:4px;
    background:transparent;
    color:#aaa;
}

.side button:hover{
    background:#191919;
    color:#fff;
}

.main{
    flex:1;
    padding:25px;
    min-width:0;
}

.card{
    background:#111;
    border:1px solid #222;
    border-radius:15px;
    padding:20px;
    margin-bottom:12px;
}

.card p{
    color:#777;
    margin:8px 0 15px;
    line-height:1.5;
}

.status{
    padding:12px;
    border-radius:10px;
    background:#111;
    border:1px solid #222;
    color:#aaa;
    margin-bottom:18px;
}

.connected{
    color:#55db87;
    border-color:#285c3d;
}

.friends{
    margin-top:10px;
}

.friend{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    border-radius:9px;
    color:#aaa;
    cursor:pointer;
}

.friend:hover{
    background:#191919;
}

.avatar{
    width:35px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#e50914;
    font-weight:bold;
}

.chat{
    height:calc(100vh - 114px);
    min-height:400px;
    display:flex;
    flex-direction:column;
    background:#0d0d0d;
    border:1px solid #222;
    border-radius:15px;
    overflow:hidden;
}

.chat-head{
    padding:17px;
    border-bottom:1px solid #222;
}

.chat-head small{
    color:#666;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px;
}

.msg{
    margin-bottom:14px;
}

.msg b{
    color:#e50914;
}

.msg span{
    color:#ccc;
}

.time{
    display:block;
    color:#555!important;
    font-size:10px;
    margin-top:4px;
}

.chat-send{
    display:flex;
    gap:8px;
    padding:10px;
    border-top:1px solid #222;
}

.chat-send input{
    flex:1;
}

.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.8);
    z-index:100;
}

.modal-box{
    width:100%;
    max-width:430px;
    padding:23px;
    background:#111;
    border:1px solid #333;
    border-radius:18px;
}

.modal-box p{
    color:#888;
    margin:10px 0 16px;
}

.code{
    padding:14px;
    background:#050505;
    border:1px solid #333;
    border-radius:9px;
    color:#e50914;
    font-family:monospace;
    font-size:12px;
    word-break:break-all;
    margin-bottom:12px;
}

.actions{
    display:flex;
    gap:8px;
}

.actions button{
    flex:1;
}

video{
    width:100%;
    max-height:65vh;
    background:#000;
    border-radius:12px;
    margin-top:15px;
}

@media(max-width:700px){

    .nav{
        display:none;
    }

    .side{
        display:none;
    }

    .main{
        padding:15px;
    }

    .user{
        font-size:13px;
    }

    .chat{
        height:calc(100vh - 94px);
        border-radius:10px;
    }

}
</style>
</head>

<body>

<div id="setup">

    <div class="setup">

        <div class="logo">
            D2
        </div>

        <h1>Bem-vindo ao D2</h1>

        <p>
            Escolha o nome que seus amigos verão.
        </p>

        <input
            id="name"
            maxlength="20"
            placeholder="Seu nome"
        >

        <br><br>

        <button
            class="red"
            style="width:100%"
            onclick="enterD2()"
        >
            Entrar
        </button>

    </div>

</div>


<div id="app">

    <header class="top">

        <div class="logo-small">
            D2
        </div>

        <nav class="nav">

            <button onclick="home()">
                🏠 Início
            </button>

            <button onclick="friendsPage()">
                👥 Amigos
            </button>

            <button onclick="settings()">
                ⚙️
            </button>

        </nav>

        <div class="user">
            🟢 <span id="username"></span>
        </div>

    </header>


    <div class="layout">

        <aside class="side">

            <h4>MENU</h4>

            <button onclick="home()">
                🏠 Início
            </button>

            <button onclick="friendsPage()">
                👥 Amigos
            </button>

            <button onclick="createInvite()">
                ➕ Adicionar amigo
            </button>

            <button onclick="joinInvite()">
                🔗 Usar convite
            </button>

            <button onclick="settings()">
                ⚙️ Configurações
            </button>

            <h4>AMIGOS</h4>

            <div id="friendList"></div>

        </aside>


        <main
            id="main"
            class="main"
        ></main>

    </div>

</div>


<div
    id="modal"
    class="modal"
>

    <div class="modal-box">

        <h2 id="modalTitle"></h2>

        <p id="modalText"></p>

        <div id="modalBody"></div>

        <div
            id="modalActions"
            class="actions"
        ></div>

    </div>

</div>
<script>
let username = localStorage.getItem("d2_username") || "";
let peer = null;
let connection = null;
let currentFriend = null;

/* =========================
   ENTRAR
========================= */

function enterD2() {
    const input = document.getElementById("name");
    const name = input.value.trim();

    if (!name) {
        alert("Digite seu nome.");
        return;
    }

    username = name;
    localStorage.setItem("d2_username", username);

    document.getElementById("setup").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("username").textContent = username;

    startPeer();
    renderFriends();
    home();
}

/* =========================
   PEERJS
========================= */

function startPeer() {
    if (peer) return;

    peer = new Peer();

    peer.on("open", id => {
        localStorage.setItem("d2_peer_id", id);
        console.log("D2 ID:", id);
        home();
    });

    peer.on("connection", conn => {
        setupConnection(conn);
    });

    peer.on("call", call => {
        call.answer();

        call.on("stream", stream => {
            showRemoteScreen(stream);
        });
    });

    peer.on("error", error => {
        console.error(error);

        if (error.type === "peer-unavailable") {
            alert("Esse amigo não está conectado agora.");
        } else {
            alert("Erro de conexão: " + error.type);
        }
    });
}

/* =========================
   CONEXÃO
========================= */

function connectToFriend(id) {
    if (!peer || !peer.id) {
        alert("Aguarde o D2 terminar de conectar.");
        return;
    }

    const conn = peer.connect(id, {
        reliable: true
    });

    setupConnection(conn);
}

function setupConnection(conn) {
    connection = conn;

    conn.on("open", () => {
        updateStatus("🟢 Conectado");

        conn.send({
            type: "hello",
            name: username
        });
    });

    conn.on("data", data => {
        receiveData(data);
    });

    conn.on("close", () => {
        updateStatus("🔴 Desconectado");
        connection = null;
    });

    conn.on("error", error => {
        console.error(error);
        updateStatus("🔴 Erro");
    });
}

/* =========================
   DADOS
========================= */

function receiveData(data) {
    if (!data) return;

    if (data.type === "hello") {
        saveFriend(connection.peer, data.name);
        return;
    }

    if (data.type === "message") {
        saveMessage(connection.peer, data.message);

        if (
            currentFriend &&
            currentFriend.id === connection.peer
        ) {
            renderChat();
        }
    }
}

/* =========================
   CONVITE
========================= */

function createInvite() {
    if (!peer || !peer.id) {
        alert("Aguarde alguns segundos e tente novamente.");
        return;
    }

    const invite = btoa(
        JSON.stringify({
            app: "D2",
            peerId: peer.id,
            name: username
        })
    );

    openModal(
        "🔗 Seu convite",
        "Mande este código para seu amigo.",
        `
            <div class="code">${escapeHTML(invite)}</div>
        `,
        [
            {
                text: "📋 Copiar",
                action: () => copyInvite(invite)
            },
            {
                text: "Fechar",
                action: closeModal
            }
        ]
    );
}

async function copyInvite(code) {
    try {
        await navigator.clipboard.writeText(code);
        alert("Convite copiado! 📋");
    } catch {
        alert("Selecione e copie o código manualmente.");
    }
}

function joinInvite() {
    openModal(
        "🔗 Adicionar amigo",
        "Cole o convite recebido.",
        `
            <input
                id="invite"
                placeholder="Cole o código aqui"
            >
        `,
        [
            {
                text: "Conectar",
                action: useInvite
            },
            {
                text: "Cancelar",
                action: closeModal
            }
        ]
    );
}

function useInvite() {
    const value =
        document.getElementById("invite").value.trim();

    if (!value) {
        alert("Cole um convite.");
        return;
    }

    try {
        const data = JSON.parse(atob(value));

        if (
            data.app !== "D2" ||
            !data.peerId
        ) {
            throw new Error();
        }

        saveFriend(data.peerId, data.name);

        currentFriend = {
            id: data.peerId,
            name: data.name
        };

        closeModal();

        updateStatus("🟡 Conectando...");

        connectToFriend(data.peerId);

        setTimeout(() => {
            openChat();
        }, 500);

    } catch {
        alert("Convite inválido.");
    }
}

/* =========================
   AMIGOS
========================= */

function getFriends() {
    return JSON.parse(
        localStorage.getItem("d2_friends") || "[]"
    );
}

function saveFriend(id, name) {
    const friends = getFriends();

    const existing =
        friends.find(friend => friend.id === id);

    if (existing) {
        existing.name = name;
    } else {
        friends.push({
            id: id,
            name: name
        });
    }

    localStorage.setItem(
        "d2_friends",
        JSON.stringify(friends)
    );

    renderFriends();
}

function renderFriends() {
    const element =
        document.getElementById("friendList");

    if (!element) return;

    const friends = getFriends();

    if (!friends.length) {
        element.innerHTML =
            `<p style="color:#555;font-size:12px">
                Nenhum amigo
            </p>`;
        return;
    }

    element.innerHTML = friends.map(
        (friend, index) => `
            <div
                class="friend"
                onclick="openFriend(${index})"
            >
                <div class="avatar">
                    ${escapeHTML(
                        friend.name.charAt(0).toUpperCase()
                    )}
                </div>

                ${escapeHTML(friend.name)}
            </div>
        `
    ).join("");
}

function friendsPage() {
    const friends = getFriends();

    let html = `
        <h1>👥 Amigos</h1>

        <p style="color:#777;margin:8px 0 20px">
            Seus amigos do D2.
        </p>
    `;

    if (!friends.length) {
        html += `
            <div class="card">
                <h3>Nenhum amigo ainda.</h3>

                <p>
                    Crie um convite e mande para seu amigo.
                </p>

                <button
                    class="red"
                    onclick="createInvite()"
                >
                    Criar convite
                </button>
            </div>
        `;
    } else {
        friends.forEach((friend, index) => {
            html += `
                <div class="card">

                    <div style="
                        display:flex;
                        align-items:center;
                        gap:10px;
                    ">

                        <div class="avatar">
                            ${escapeHTML(
                                friend.name.charAt(0).toUpperCase()
                            )}
                        </div>

                        <strong>
                            ${escapeHTML(friend.name)}
                        </strong>

                    </div>

                    <br>

                    <button
                        class="red"
                        onclick="openFriend(${index})"
                    >
                        Abrir conversa
                    </button>

                </div>
            `;
        });
    }

    document.getElementById("main").innerHTML = html;
}

function openFriend(index) {
    const friends = getFriends();

    currentFriend = friends[index];

    if (
        connection &&
        connection.open &&
        connection.peer === currentFriend.id
    ) {
        openChat();
        return;
    }

    updateStatus("🟡 Conectando...");

    connectToFriend(currentFriend.id);

    setTimeout(() => {
        openChat();
    }, 700);
}

/* =========================
   CHAT
========================= */

function getMessageKey() {
    if (!currentFriend) return null;

    return "d2_messages_" + currentFriend.id;
}

function getMessages() {
    const key = getMessageKey();

    if (!key) return [];

    return JSON.parse(
        localStorage.getItem(key) || "[]"
    );
}

function cleanMessages(messages) {
    const limit =
        Date.now() -
        24 * 60 * 60 * 1000;

    return messages.filter(
        message => message.time > limit
    );
}

function saveMessage(peerId, message) {
    const key = "d2_messages_" + peerId;

    let messages = JSON.parse(
        localStorage.getItem(key) || "[]"
    );

    messages.push(message);

    messages = cleanMessages(messages);

    localStorage.setItem(
        key,
        JSON.stringify(messages)
    );
}

function openChat() {
    if (!currentFriend) {
        friendsPage();
        return;
    }

    document.getElementById("main").innerHTML = `
        <div class="chat">

            <div class="chat-head">

                <strong>
                    ${escapeHTML(currentFriend.name)}
                </strong>

                <br>

                <small>
                    Mensagens expiram após 24 horas
                </small>

            </div>

            <div
                id="messages"
                class="messages"
            ></div>

            <div class="chat-send">

                <input
                    id="messageInput"
                    placeholder="Digite uma mensagem..."
                    maxlength="1000"
                >

                <button
                    class="red"
                    onclick="sendMessage()"
                >
                    Enviar
                </button>

            </div>

        </div>

        <br>

        <button
            class="dark"
            onclick="shareScreen()"
        >
            🖥️ Compartilhar tela
        </button>
    `;

    renderChat();

    const input =
        document.getElementById("messageInput");

    input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
}

function sendMessage() {
    const input =
        document.getElementById("messageInput");

    const text = input.value.trim();

    if (!text) return;

    if (
        !connection ||
        !connection.open
    ) {
        alert("Você não está conectado ao amigo.");
        return;
    }

    const message = {
        sender: username,
        text: text,
        time: Date.now()
    };

    connection.send({
        type: "message",
        message: message
    });

    saveMessage(
        connection.peer,
        message
    );

    input.value = "";

    renderChat();
}

function renderChat() {
    const box =
        document.getElementById("messages");

    if (!box) return;

    let messages =
        cleanMessages(getMessages());

    box.innerHTML = messages.length
        ? messages.map(message => `
            <div class="msg">

                <b>
                    ${escapeHTML(message.sender)}
                </b>

                <span>
                    ${escapeHTML(message.text)}
                </span>

                <span class="time">
                    ${formatTime(message.time)}
                </span>

            </div>
        `).join("")
        : `
            <p style="color:#555">
                Nenhuma mensagem ainda.
            </p>
        `;

    box.scrollTop = box.scrollHeight;
}

/* =========================
   COMPARTILHAR TELA
========================= */

async function shareScreen() {
    if (
        !connection ||
        !connection.open
    ) {
        alert("Conecte-se com seu amigo primeiro.");
        return;
    }

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getDisplayMedia
    ) {
        alert(
            "Seu navegador não permite compartilhamento de tela."
        );
        return;
    }

    try {
        const stream =
            await navigator.mediaDevices.getDisplayMedia({
                video: true,
                audio: false
            });

        const call =
            peer.call(
                connection.peer,
                stream
            );

        stream
            .getVideoTracks()[0]
            .addEventListener(
                "ended",
                () => {
                    call.close();
                }
            );

    } catch (error) {
        console.log(
            "Compartilhamento cancelado."
        );
    }
}

/* =========================
   TELA RECEBIDA
========================= */

function showRemoteScreen(stream) {
    let video =
        document.getElementById("remoteScreen");

    if (!video) {
        video = document.createElement("video");

        video.id = "remoteScreen";

        video.autoplay = true;
        video.playsInline = true;

        const main =
            document.getElementById("main");

        main.appendChild(video);
    }

    video.srcObject = stream;
}

/* =========================
   INÍCIO
========================= */

function home() {
    document.getElementById("main").innerHTML = `

        <h1>
            Olá, ${escapeHTML(username)} 👋
        </h1>

        <p style="
            color:#777;
            margin:8px 0 20px;
        ">
            Bem-vindo ao D2.
        </p>

        <div
            id="connectionStatus"
            class="status"
        >
            🟡 Conectando...
        </div>

        <div class="card">

            <h3>🔗 Convite</h3>

            <p>
                Gere seu convite permanente
                para adicionar um amigo.
            </p>

            <button
                class="red"
                onclick="createInvite()"
            >
                Criar convite
            </button>

        </div>

        <div class="card">

            <h3>👥 Amigos</h3>

            <p>
                Veja seus amigos e abra uma conversa.
            </p>

            <button
                class="dark"
                onclick="friendsPage()"
            >
                Ver amigos
            </button>

        </div>
    `;
}

function updateStatus(text) {
    const element =
        document.getElementById("connectionStatus");

    if (!element) return;

    element.textContent = text;

    element.classList.toggle(
        "connected",
        text.includes("🟢")
    );
}

/* =========================
   CONFIGURAÇÕES
========================= */

function settings() {
    document.getElementById("main").innerHTML = `

        <h1>⚙️ Configurações</h1>

        <p style="
            color:#777;
            margin:8px 0 20px;
        ">
            Configurações do D2.
        </p>

        <div class="card">

            <h3>✏️ Nome</h3>

            <p>
                Seu nome atual:
                <strong>
                    ${escapeHTML(username)}
                </strong>
            </p>

            <button
                class="red"
                onclick="changeName()"
            >
                Mudar nome
            </button>

        </div>

        <div class="card">

            <h3>⏰ Mensagens</h3>

            <p>
                As mensagens salvas neste dispositivo
                são apagadas depois de 24 horas.
            </p>

        </div>

        <div class="card">

            <h3>🚪 Sessão</h3>

            <p>
                Sair do D2 neste dispositivo.
            </p>

            <button
                class="dark"
                onclick="logout()"
            >
                Sair
            </button>

        </div>
    `;
}

function changeName() {
    openModal(
        "✏️ Mudar nome",
        "Digite seu novo nome.",
        `
            <input
                id="newName"
                value="${escapeAttribute(username)}"
                maxlength="20"
            >
        `,
        [
            {
                text:"Salvar",
                action:saveNewName
            },
            {
                text:"Cancelar",
                action:closeModal
            }
        ]
    );
}

function saveNewName() {
    const name =
        document.getElementById("newName")
            .value.trim();

    if (!name) {
        alert("Digite um nome.");
        return;
    }

    username = name;

    localStorage.setItem(
        "d2_username",
        username
    );

    document.getElementById("username")
        .textContent = username;

    closeModal();
    home();
}

function logout() {
    if (!confirm("Sair do D2?")) return;

    if (peer) {
        peer.destroy();
        peer = null;
    }

    localStorage.removeItem("d2_username");

    location.reload();
}

/* =========================
   MODAL
========================= */

function openModal(
    title,
    text,
    body,
    buttons
) {
    document.getElementById("modalTitle")
        .textContent = title;

    document.getElementById("modalText")
        .textContent = text;

    document.getElementById("modalBody")
        .innerHTML = body;

    const actions =
        document.getElementById(
            "modalActions"
        );

    actions.innerHTML = "";

    buttons.forEach(button => {
        const element =
            document.createElement("button");

        element.className = "dark";
        element.textContent = button.text;

        element.onclick =
            button.action;

        actions.appendChild(element);
    });

    document.getElementById("modal")
        .style.display = "flex";
}

function closeModal() {
    document.getElementById("modal")
        .style.display = "none";
}

/* =========================
   UTILIDADES
========================= */

function formatTime(time) {
    return new Date(time)
        .toLocaleTimeString(
            "pt-BR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}

function escapeHTML(text) {
    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function escapeAttribute(text) {
    return escapeHTML(text);
}

/* =========================
   CARREGAR AUTOMATICAMENTE
========================= */

window.addEventListener("load", () => {

    const saved =
        localStorage.getItem("d2_username");

    if (saved) {

        username = saved;

        document.getElementById("setup")
            .style.display = "none";

        document.getElementById("app")
            .style.display = "block";

        document.getElementById("username")
            .textContent = username;

        startPeer();

        renderFriends();

        home();
    }
});
