<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#080808">

<title>D2</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#080808;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

button{
    border:0;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
}

input{
    width:100%;
    border:1px solid #333;
    outline:none;
    background:#111;
    color:white;
    padding:14px;
    border-radius:10px;
    font-size:16px;
}

/* =========================
   TELA DE ENTRADA
========================= */

#setup{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(
            circle at center,
            #3d080c 0%,
            #120305 35%,
            #080808 70%
        );
}

.setup-box{
    width:100%;
    max-width:420px;
    background:#111;
    border:1px solid #292929;
    border-radius:22px;
    padding:30px 24px;
    text-align:center;
    box-shadow:0 20px 70px rgba(0,0,0,.6);
}

.logo{
    width:85px;
    height:85px;
    border-radius:22px;
    background:#e50914;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 20px;
    font-size:31px;
    font-weight:900;
}

.setup-box h1{
    font-size:27px;
}

.setup-box p{
    color:#888;
    line-height:1.5;
    margin:10px 0 22px;
}

.red{
    background:#e50914;
    color:white;
}

.red:active{
    transform:scale(.97);
}

.dark{
    background:#191919;
    color:white;
    border:1px solid #333;
}

.dark:active{
    transform:scale(.97);
}

/* =========================
   APP
========================= */

#app{
    display:none;
    min-height:100vh;
}

.topbar{
    height:64px;
    background:#0d0d0d;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:20;
}

.d2-logo{
    color:#e50914;
    font-size:27px;
    font-weight:900;
}

.desktop-nav{
    display:flex;
    margin-left:28px;
    gap:4px;
}

.desktop-nav button{
    background:transparent;
    color:#999;
    padding:10px 14px;
    border-radius:8px;
}

.desktop-nav button:hover{
    background:#191919;
    color:white;
}

.username{
    margin-left:auto;
    color:#aaa;
}

/* =========================
   LAYOUT
========================= */

.layout{
    display:flex;
    min-height:calc(100vh - 64px);
}

.sidebar{
    width:230px;
    flex-shrink:0;
    background:#0c0c0c;
    border-right:1px solid #222;
    padding:18px;
}

.sidebar-title{
    color:#555;
    font-size:11px;
    font-weight:bold;
    margin:12px 0 8px;
}

.sidebar button{
    width:100%;
    text-align:left;
    background:transparent;
    color:#999;
    padding:12px;
    border-radius:9px;
    margin-bottom:3px;
}

.sidebar button:hover{
    background:#191919;
    color:white;
}

.main{
    flex:1;
    min-width:0;
    padding:25px;
    padding-bottom:40px;
}

.main h1{
    font-size:28px;
}

.subtitle{
    color:#777;
    margin-top:7px;
    margin-bottom:20px;
}

.card{
    background:#111;
    border:1px solid #222;
    border-radius:15px;
    padding:20px;
    margin-bottom:12px;
}

.card h3{
    margin-bottom:8px;
}

.card p{
    color:#777;
    line-height:1.5;
    margin-bottom:15px;
}

.card button{
    padding:12px 16px;
    border-radius:9px;
}

/* =========================
   STATUS
========================= */

.status{
    background:#111;
    border:1px solid #292929;
    color:#aaa;
    padding:13px;
    border-radius:10px;
    margin-bottom:18px;
}

.status.online{
    color:#55dc87;
    border-color:#285c3d;
}

/* =========================
   AMIGOS
========================= */

.friend{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px;
    border-radius:9px;
    color:#aaa;
    cursor:pointer;
    touch-action:manipulation;
}

.friend:active{
    background:#222;
}

.avatar{
    width:38px;
    height:38px;
    flex-shrink:0;
    border-radius:50%;
    background:#e50914;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* =========================
   CHAT
========================= */

.chat{
    height:calc(100vh - 114px);
    min-height:400px;
    background:#0d0d0d;
    border:1px solid #222;
    border-radius:15px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.chat-header{
    padding:16px;
    border-bottom:1px solid #222;
}

.chat-header strong{
    font-size:17px;
}

.chat-header small{
    color:#666;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px;
    -webkit-overflow-scrolling:touch;
}

.message{
    margin-bottom:15px;
}

.message-name{
    color:#e50914;
    font-weight:bold;
}

.message-text{
    color:#ddd;
    word-break:break-word;
}

.message-time{
    display:block;
    color:#555;
    font-size:10px;
    margin-top:3px;
}

.chat-input{
    display:flex;
    gap:8px;
    padding:10px;
    border-top:1px solid #222;
}

.chat-input input{
    min-width:0;
}

.chat-input button{
    flex-shrink:0;
}

/* =========================
   VIDEO
========================= */

.remote-video{
    width:100%;
    max-height:65vh;
    background:#000;
    border-radius:12px;
    margin-top:15px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.82);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal-box{
    width:100%;
    max-width:430px;
    max-height:90vh;
    overflow-y:auto;
    background:#111;
    border:1px solid #333;
    border-radius:18px;
    padding:22px;
}

.modal-box h2{
    margin-bottom:8px;
}

.modal-box p{
    color:#888;
    line-height:1.5;
    margin-bottom:15px;
}

.code{
    background:#050505;
    border:1px solid #333;
    border-radius:9px;
    padding:13px;
    color:#e50914;
    font-family:monospace;
    font-size:12px;
    word-break:break-all;
    margin-bottom:12px;
}

.modal-actions{
    display:flex;
    gap:8px;
}

.modal-actions button{
    flex:1;
    min-height:45px;
}

/* =========================
   MENU MOBILE
========================= */

.mobile-nav{
    display:none;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    body{
        padding-bottom:68px;
    }

    .topbar{
        height:58px;
        padding:0 14px;
    }

    .d2-logo{
        font-size:24px;
    }

    .desktop-nav{
        display:none;
    }

    .username{
        font-size:13px;
    }

    .layout{
        min-height:calc(100vh - 58px);
    }

    .sidebar{
        display:none;
    }

    .main{
        width:100%;
        padding:16px;
        padding-bottom:90px;
    }

    .main h1{
        font-size:24px;
    }

    .card{
        padding:17px;
    }

    .chat{
        height:calc(100vh - 145px);
        min-height:350px;
        border-radius:12px;
    }

    .chat-input{
        padding:8px;
    }

    .chat-input button{
        padding:12px;
    }

    .mobile-nav{
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        height:68px;
        z-index:90;
        display:flex;
        align-items:stretch;
        justify-content:space-around;
        background:#0c0c0c;
        border-top:1px solid #292929;
        padding-bottom:env(safe-area-inset-bottom);
    }

    .mobile-nav button{
        flex:1;
        background:transparent;
        color:#777;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:3px;
        font-size:11px;
        touch-action:manipulation;
    }

    .mobile-nav button span{
        font-size:21px;
    }

    .mobile-nav button:active{
        background:#191919;
        color:white;
    }

    .mobile-nav button.active{
        color:#e50914;
    }

}

/* =========================
   CELULAR MUITO PEQUENO
========================= */

@media(max-width:380px){

    .main{
        padding:12px;
    }

    .username{
        max-width:120px;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
    }

    .chat-input button{
        font-size:0;
    }

    .chat-input button::after{
        content:"➤";
        font-size:18px;
    }

}

</style>
</head>

<body>

<!-- =========================
     ENTRADA
========================= -->

<section id="setup">

    <div class="setup-box">

        <div class="logo">
            D2
        </div>

        <h1>Bem-vindo ao D2</h1>

        <p>
            Escolha o nome que seus amigos verão.
        </p>

        <input
            id="nameInput"
            maxlength="20"
            autocomplete="off"
            placeholder="Seu nome"
        >

        <br><br>

        <button
            class="red"
            id="enterButton"
            style="width:100%;min-height:48px"
        >
            Entrar
        </button>

    </div>

</section>


<!-- =========================
     APLICATIVO
========================= -->

<section id="app">

    <header class="topbar">

        <div class="d2-logo">
            D2
        </div>

        <nav class="desktop-nav">

            <button id="desktopHome">
                🏠 Início
            </button>

            <button id="desktopFriends">
                👥 Amigos
            </button>

            <button id="desktopSettings">
                ⚙️ Configurações
            </button>

        </nav>

        <div class="username">
            🟢 <span id="username"></span>
        </div>

    </header>


    <div class="layout">

        <aside class="sidebar">

            <div class="sidebar-title">
                MENU
            </div>

            <button id="sideHome">
                🏠 Início
            </button>

            <button id="sideFriends">
                👥 Amigos
            </button>

            <button id="sideInvite">
                ➕ Adicionar amigo
            </button>

            <button id="sideJoin">
                🔗 Usar convite
            </button>

            <button id="sideSettings">
                ⚙️ Configurações
            </button>

            <div class="sidebar-title">
                AMIGOS
            </div>

            <div id="friendList"></div>

        </aside>


        <main
            class="main"
            id="main"
        ></main>

    </div>


    <!-- MENU DO CELULAR -->

    <nav class="mobile-nav">

        <button id="mobileHome">
            <span>🏠</span>
            Início
        </button>

        <button id="mobileFriends">
            <span>👥</span>
            Amigos
        </button>

        <button id="mobileInvite">
            <span>➕</span>
            Adicionar
        </button>

        <button id="mobileSettings">
            <span>⚙️</span>
            Config.
        </button>

    </nav>

</section>


<!-- =========================
     MODAL
========================= -->

<div
    class="modal"
    id="modal"
>

    <div class="modal-box">

        <h2 id="modalTitle"></h2>

        <p id="modalText"></p>

        <div id="modalBody"></div>

        <div
            class="modal-actions"
            id="modalActions"
        ></div>

    </div>

</div>


<script>

/* ========================================
   VARIÁVEIS
======================================== */

let username = "";
let peer = null;
let connection = null;
let currentFriend = null;


/* ========================================
   ELEMENTOS
======================================== */

const setup =
    document.getElementById("setup");

const app =
    document.getElementById("app");

const nameInput =
    document.getElementById("nameInput");

const enterButton =
    document.getElementById("enterButton");

const usernameElement =
    document.getElementById("username");

const main =
    document.getElementById("main");


/* ========================================
   NAVEGAÇÃO
======================================== */

function setupNavigation(){

    document.getElementById("desktopHome")
        .addEventListener("click",home);

    document.getElementById("desktopFriends")
        .addEventListener("click",friendsPage);

    document.getElementById("desktopSettings")
        .addEventListener("click",settings);

    document.getElementById("sideHome")
        .addEventListener("click",home);

    document.getElementById("sideFriends")
        .addEventListener("click",friendsPage);

    document.getElementById("sideInvite")
        .addEventListener("click",createInvite);

    document.getElementById("sideJoin")
        .addEventListener("click",joinInvite);

    document.getElementById("sideSettings")
        .addEventListener("click",settings);


    document.getElementById("mobileHome")
        .addEventListener("click",home);

    document.getElementById("mobileFriends")
        .addEventListener("click",friendsPage);

    document.getElementById("mobileInvite")
        .addEventListener("click",createInvite);

    document.getElementById("mobileSettings")
        .addEventListener("click",settings);
}


/* ========================================
   ENTRAR
======================================== */

enterButton.addEventListener(
    "click",
    enterD2
);

nameInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            enterD2();
        }

    }
);


function enterD2(){

    const name =
        nameInput.value.trim();

    if(!name){

        alert(
            "Digite seu nome primeiro."
        );

        nameInput.focus();

        return;
    }

    username = name;

    localStorage.setItem(
        "d2_username",
        username
    );

    setup.style.display = "none";

    app.style.display = "block";

    usernameElement.textContent =
        username;

    startPeer();

    renderFriends();

    home();
}


/* ========================================
   PEER
======================================== */

function startPeer(){

    if(peer) return;

    peer = new Peer();

    peer.on(
        "open",
        function(id){

            localStorage.setItem(
                "d2_peer_id",
                id
            );

            updateStatus(
                "🟢 D2 conectado"
            );

        }
    );


    peer.on(
        "connection",
        function(conn){

            setupConnection(conn);

        }
    );


    peer.on(
        "call",
        function(call){

            call.answer();

            call.on(
                "stream",
                function(stream){

                    showRemoteScreen(
                        stream
                    );

                }
            );

        }
    );


    peer.on(
        "error",
        function(error){

            console.log(
                "PeerJS:",
                error
            );

            if(
                error.type ===
                "peer-unavailable"
            ){

                alert(
                    "Seu amigo não está conectado."
                );

            }

        }
    );

}


/* ========================================
   CONEXÃO
======================================== */

function connectToFriend(id){

    if(
        !peer ||
        !peer.id
    ){

        alert(
            "Aguarde o D2 conectar."
        );

        return;
    }

    const conn =
        peer.connect(
            id,
            {
                reliable:true
            }
        );

    setupConnection(conn);
}


function setupConnection(conn){

    connection = conn;

    conn.on(
        "open",
        function(){

            updateStatus(
                "🟢 Conectado"
            );

            conn.send({

                type:"hello",

                name:username

            });

        }
    );


    conn.on(
        "data",
        function(data){

            receiveData(data);

        }
    );


    conn.on(
        "close",
        function(){

            connection = null;

            updateStatus(
                "🔴 Desconectado"
            );

        }
    );

}


/* ========================================
   RECEBER
======================================== */

function receiveData(data){

    if(!data) return;


    if(
        data.type ===
        "hello"
    ){

        saveFriend(
            connection.peer,
            data.name
        );

        return;
    }


    if(
        data.type ===
        "message"
    ){

        saveMessage(
            connection.peer,
            data.message
        );

        if(
            currentFriend &&
            currentFriend.id ===
            connection.peer
        ){

            renderChat();

        }

    }

}


/* ========================================
   CONVITE
======================================== */

function createInvite(){

    if(
        !peer ||
        !peer.id
    ){

        alert(
            "Aguarde o D2 conectar."
        );

        return;
    }


    const data = {

        app:"D2",

        peerId:peer.id,

        name:username

    };


    const invite =
        btoa(
            JSON.stringify(data)
        );


    openModal(

        "🔗 Convite do D2",

        "Envie este código para seu amigo pelo WhatsApp.",

        `
            <div class="code">
                ${escapeHTML(invite)}
            </div>
        `,

        [

            {
                text:"📋 Copiar",
                action:function(){

                    copyText(invite);

                }
            },

            {
                text:"Fechar",
                action:closeModal
            }

        ]

    );

}


async function copyText(text){

    try{

        await navigator.clipboard.writeText(
            text
        );

        alert(
            "Copiado! 📋"
        );

    }catch{

        alert(
            "Não foi possível copiar automaticamente."
        );

    }

}


function joinInvite(){

    openModal(

        "🔗 Adicionar amigo",

        "Cole o convite que seu amigo enviou.",

        `
            <input
                id="inviteInput"
                placeholder="Cole o código aqui"
                autocomplete="off"
            >
        `,

        [

            {
                text:"Conectar",
                action:useInvite
            },

            {
                text:"Cancelar",
                action:closeModal
            }

        ]

    );

}


function useInvite(){

    const input =
        document.getElementById(
            "inviteInput"
        );

    const value =
        input.value.trim();


    if(!value){

        alert(
            "Cole um convite."
        );

        return;
    }


    try{

        const data =
            JSON.parse(
                atob(value)
            );


        if(
            data.app !== "D2" ||
            !data.peerId
        ){

            throw new Error();

        }


        saveFriend(
            data.peerId,
            data.name
        );


        currentFriend = {

            id:data.peerId,

            name:data.name

        };


        closeModal();

        updateStatus(
            "🟡 Conectando..."
        );


        connectToFriend(
            data.peerId
        );


        setTimeout(
            openChat,
            800
        );


    }catch{

        alert(
            "Convite inválido."
        );

    }

}


/* ========================================
   AMIGOS
======================================== */

function getFriends(){

    return JSON.parse(
        localStorage.getItem(
            "d2_friends"
        ) || "[]"
    );

}


function saveFriend(id,name){

    const friends =
        getFriends();


    const existing =
        friends.find(
            friend =>
                friend.id === id
        );


    if(existing){

        existing.name =
            name;

    }else{

        friends.push({

            id:id,

            name:name

        });

    }


    localStorage.setItem(

        "d2_friends",

        JSON.stringify(friends)

    );


    renderFriends();

}


function renderFriends(){

    const list =
        document.getElementById(
            "friendList"
        );


    if(!list) return;


    const friends =
        getFriends();


    if(!friends.length){

        list.innerHTML = `
            <p style="
                color:#555;
                font-size:12px;
                padding:8px;
            ">
                Nenhum amigo
            </p>
        `;

        return;
    }


    list.innerHTML =
        friends.map(
            function(friend,index){

                return `

                    <div
                        class="friend"
                        data-index="${index}"
                    >

                        <div class="avatar">
                            ${escapeHTML(
                                friend.name
                                    .charAt(0)
                                    .toUpperCase()
                            )}
                        </div>

                        <span>
                            ${escapeHTML(
                                friend.name
                            )}
                        </span>

                    </div>

                `;

            }
        ).join("");


    list.querySelectorAll(
        ".friend"
    ).forEach(
        function(element){

            element.addEventListener(
                "click",
                function(){

                    openFriend(
                        Number(
                            element.dataset.index
                        )
                    );

                }
            );

        }
    );

}


function friendsPage(){

    setActive(
        "mobileFriends"
    );


    const friends =
        getFriends();


    let html = `

        <h1>👥 Amigos</h1>

        <p class="subtitle">
            Seus amigos do D2.
        </p>

    `;


    if(!friends.length){

        html += `

            <div class="card">

                <h3>
                    Nenhum amigo ainda.
                </h3>

                <p>
                    Crie um convite e envie para seu amigo.
                </p>

                <button
                    class="red"
                    id="emptyInvite"
                >
                    ➕ Criar convite
                </button>

            </div>

        `;

    }else{

        friends.forEach(
            function(friend,index){

                html += `

                    <div class="card">

                        <div style="
                            display:flex;
                            align-items:center;
                            gap:10px;
                        ">

                            <div class="avatar">
                                ${escapeHTML(
                                    friend.name
                                        .charAt(0)
                                        .toUpperCase()
                                )}
                            </div>

                            <strong>
                                ${escapeHTML(
                                    friend.name
                                )}
                            </strong>

                        </div>

                        <br>

                        <button
                            class="red friend-open"
                            data-index="${index}"
                        >
                            💬 Abrir conversa
                        </button>

                    </div>

                `;

            }
        );

    }


    main.innerHTML =
        html;


    const empty =
        document.getElementById(
            "emptyInvite"
        );

    if(empty){

        empty.addEventListener(
            "click",
            createInvite
        );

    }


    document.querySelectorAll(
        ".friend-open"
    ).forEach(
        function(button){

            button.addEventListener(
                "click",
                function(){

                    openFriend(
                        Number(
                            button.dataset.index
                        )
                    );

                }
            );

        }
    );

}


function openFriend(index){

    const friends =
        getFriends();


    currentFriend =
        friends[index];


    if(
        connection &&
        connection.open &&
        connection.peer ===
        currentFriend.id
    ){

        openChat();

        return;

    }


    updateStatus(
        "🟡 Conectando..."
    );


    connectToFriend(
        currentFriend.id
    );


    setTimeout(
        openChat,
        800
    );

}


/* ========================================
   CHAT
======================================== */

function messageKey(){

    if(!currentFriend)
        return null;

    return (
        "d2_messages_" +
        currentFriend.id
    );

}


function getMessages(){

    const key =
        messageKey();


    if(!key)
        return [];


    return JSON.parse(
        localStorage.getItem(
            key
        ) || "[]"
    );

}


function cleanMessages(messages){

    const limit =
        Date.now() -
        24 * 60 * 60 * 1000;


    return messages.filter(
        message =>
            message.time > limit
    );

}


function saveMessage(
    peerId,
    message
){

    const key =
        "d2_messages_" +
        peerId;


    let messages =
        JSON.parse(
            localStorage.getItem(
                key
            ) || "[]"
        );


    messages.push(
        message
    );


    messages =
        cleanMessages(
            messages
        );


    localStorage.setItem(
        key,
        JSON.stringify(messages)
    );

}


function openChat(){

    if(!currentFriend){

        friendsPage();

        return;

    }


    main.innerHTML = `

        <button
            class="dark"
            id="backFriends"
            style="margin-bottom:12px"
        >
            ← Voltar para amigos
        </button>


        <div class="chat">

            <div class="chat-header">

                <strong>
                    ${escapeHTML(
                        currentFriend.name
                    )}
                </strong>

                <br>

                <small>
                    Mensagens expiram após 24 horas
                </small>

            </div>


            <div
                class="messages"
                id="messages"
            ></div>


            <div class="chat-input">

                <input
                    id="messageInput"
                    placeholder="Digite uma mensagem..."
                    maxlength="1000"
                    autocomplete="off"
                >

                <button
                    class="red"
                    id="sendButton"
                >
                    Enviar
                </button>

            </div>

        </div>


        <br>


        <button
            class="red"
            id="screenButton"
            style="width:100%"
        >
            🖥️ Compartilhar tela
        </button>

    `;


    document.getElementById(
        "backFriends"
    ).addEventListener(
        "click",
        friendsPage
    );


    document.getElementById(
        "sendButton"
    ).addEventListener(
        "click",
        sendMessage
    );


    document.getElementById(
        "screenButton"
    ).addEventListener(
        "click",
        shareScreen
    );


    const input =
        document.getElementById(
            "messageInput"
        );


    input.addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                sendMessage();

            }

        }
    );


    renderChat();

}


function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );


    if(!input)
        return;


    const text =
        input.value.trim();


    if(!text)
        return;


    if(
        !connection ||
        !connection.open
    ){

        alert(
            "Você não está conectado ao amigo."
        );

        return;

    }


    const message = {

        sender:username,

        text:text,

        time:Date.now()

    };


    connection.send({

        type:"message",

        message:message

    });


    saveMessage(
        connection.peer,
        message
    );


    input.value = "";

    renderChat();

}


function renderChat(){

    const box =
        document.getElementById(
            "messages"
        );


    if(!box)
        return;


    let messages =
        cleanMessages(
            getMessages()
        );


    if(!messages.length){

        box.innerHTML = `

            <p style="color:#555">
                Nenhuma mensagem ainda.
            </p>

        `;

        return;

    }


    box.innerHTML =
        messages.map(
            function(message){

                return `

                    <div class="message">

                        <span class="message-name">
                            ${escapeHTML(
                                message.sender
                            )}
                        </span>

                        <span class="message-text">
                            ${escapeHTML(
                                message.text
                            )}
                        </span>

                        <span class="message-time">
                            ${formatTime(
                                message.time
                            )}
                        </span>

                    </div>

                `;

            }
        ).join("");


    box.scrollTop =
        box.scrollHeight;

}


/* ========================================
   COMPARTILHAMENTO
======================================== */

async function shareScreen(){

    if(
        !connection ||
        !connection.open
    ){

        alert(
            "Conecte-se ao seu amigo primeiro."
        );

        return;

    }


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getDisplayMedia
    ){

        alert(
            "Seu navegador não permite compartilhamento de tela."
        );

        return;

    }


    try{

        const stream =
            await navigator.mediaDevices
                .getDisplayMedia({

                    video:true,

                    audio:false

                });


        const call =
            peer.call(
                connection.peer,
                stream
            );


        const track =
            stream.getVideoTracks()[0];


        if(track){

            track.addEventListener(
                "ended",
                function(){

                    call.close();

                }
            );

        }


    }catch(error){

        console.log(
            "Compartilhamento cancelado."
        );

    }

}


function showRemoteScreen(stream){

    let video =
        document.getElementById(
            "remoteScreen"
        );


    if(!video){

        video =
            document.createElement(
                "video"
            );

        video.id =
            "remoteScreen";

        video.className =
            "remote-video";

        video.autoplay = true;

        video.playsInline = true;

        main.appendChild(
            video
        );

    }


    video.srcObject =
        stream;

}

        );

    if(!name){

        );

function logout(){

    if(
        !confirm(
            "Tem certeza que deseja sair?"
        )
    ){

    }


    if(peer){

        peer.destroy();

        peer = null;

    }


    localStorage.removeItem(
        "d2_username"
    );


    location.reload();

}


/* ========================================
   MODAL
======================================== */

function openModal(
    title,
    text,
    body,
    buttons
){

    document.getElementById(
        "modalTitle"
    ).textContent =
        title;


    document.getElementById(
        "modalText"
    ).textContent =
        text;


    document.getElementById(
        "modalBody"
    ).innerHTML =
        body;


    const actions =
        document.getElementById(
            "modalActions"
        );


    actions.innerHTML = "";


    buttons.forEach(
        function(button){

            const element =
                document.createElement(
                    "button"
                );


            element.className =
                "dark";


            element.textContent =
                button.text;


            element.addEventListener(
                "click",
                button.action
            );


            actions.appendChild(
                element
            );

        }
    );


    document.getElementById(
        "modal"
    ).style.display =
        "flex";

}


function closeModal(){

    document.getElementById(
        "modal"
    ).style.display =
        "none";

}


/* ========================================
   UTILIDADES
======================================== */

function formatTime(time){

    return new Date(time)
        .toLocaleTimeString(
            "pt-BR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(text){

    return escapeHTML(text);

}


function setActive(id){

    document.querySelectorAll(
        ".mobile-nav button"
    ).forEach(
        function(button){

            button.classList.remove(
                "active"
            );

        }
    );


    const element =
        document.getElementById(id);


    if(element){

        element.classList.add(
            "active"
        );

    }

}
