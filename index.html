<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta name="theme-color" content="#e50914">

<title>D2</title>

<style>

/* =====================================================
   D2 — ESTILO
   ===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #080808;
    color: #ffffff;
    min-height: 100vh;
}

button,
input,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}


/* =====================================================
   TELA DE CONFIGURAÇÃO
   ===================================================== */

#setup {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #26090c 0%,
            #0d0d0d 45%,
            #050505 100%
        );
}

.setup-box {
    width: min(430px, 90%);
    padding: 40px;

    background: #111111;

    border: 1px solid #2b2b2b;
    border-radius: 20px;

    box-shadow:
        0 20px 80px rgba(0,0,0,.7);

    text-align: center;
}

.logo-big {
    width: 90px;
    height: 90px;

    margin: 0 auto 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #e50914;

    border-radius: 24px;

    color: #ffffff;

    font-size: 34px;
    font-weight: 900;

    box-shadow:
        0 0 35px rgba(229,9,20,.25);
}

.setup-box h1 {
    margin-bottom: 10px;
}

.setup-box p {
    color: #999;
    line-height: 1.5;
    margin-bottom: 25px;
}

.setup-box input {
    width: 100%;

    padding: 15px;

    border: 1px solid #333;
    border-radius: 10px;

    background: #080808;
    color: white;

    outline: none;

    margin-bottom: 12px;
}

.setup-box input:focus {
    border-color: #e50914;
}


/* =====================================================
   BOTÕES
   ===================================================== */

.primary {
    width: 100%;

    border: none;
    border-radius: 10px;

    padding: 14px;

    background: #e50914;
    color: white;

    font-weight: bold;

    transition: .2s;
}

.primary:hover {
    background: #ff1c27;
    transform: translateY(-1px);
}

.secondary {
    border: 1px solid #333;
    border-radius: 10px;

    padding: 12px 15px;

    background: #171717;
    color: white;
}

.secondary:hover {
    background: #222;
}

.danger {
    background: #451014;
    border: 1px solid #7d1b22;
    color: #ff7d83;
}


/* =====================================================
   APLICATIVO
   ===================================================== */

#app {
    display: none;
    min-height: 100vh;
}


/* =====================================================
   TOPO
   ===================================================== */

.topbar {
    height: 70px;

    display: flex;
    align-items: center;

    padding: 0 25px;

    border-bottom: 1px solid #222;

    background: #0d0d0d;
}

.logo {
    font-size: 25px;
    font-weight: 900;

    color: #e50914;

    margin-right: 40px;
}

.top-nav {
    display: flex;
    gap: 8px;
}

.top-nav button {
    padding: 9px 15px;

    border: none;
    border-radius: 8px;

    background: transparent;
    color: #999;
}

.top-nav button:hover,
.top-nav button.active {
    background: #1a1a1a;
    color: white;
}

.profile {
    margin-left: auto;

    display: flex;
    align-items: center;

    gap: 8px;

    color: #bbb;
}

.status {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #3bd16f;
}


/* =====================================================
   LAYOUT
   ===================================================== */

.layout {
    display: flex;

    min-height: calc(100vh - 70px);
}


/* =====================================================
   SIDEBAR
   ===================================================== */

.sidebar {
    width: 250px;

    background: #0c0c0c;

    border-right: 1px solid #222;

    padding: 20px;
}

.sidebar-title {
    color: #666;

    font-size: 11px;
    font-weight: bold;

    letter-spacing: 1px;

    margin: 10px 0;
}

.sidebar button {
    width: 100%;

    text-align: left;

    border: none;
    border-radius: 8px;

    background: transparent;
    color: #aaa;

    padding: 12px;

    margin-bottom: 4px;
}

.sidebar button:hover {
    background: #181818;
    color: white;
}

.friend {
    display: flex;
    align-items: center;

    gap: 10px;

    padding: 10px;

    border-radius: 8px;

    color: #bbb;

    cursor: pointer;
}

.friend:hover {
    background: #181818;
}

.avatar {
    width: 34px;
    height: 34px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #e50914;

    font-weight: bold;
}


/* =====================================================
   CONTEÚDO
   ===================================================== */

.content {
    flex: 1;

    padding: 35px;

    overflow-y: auto;
}

.hero {
    max-width: 850px;
}

.hero h1 {
    font-size: 36px;
    margin-bottom: 10px;
}

.hero p {
    color: #888;
    margin-bottom: 30px;
}

.cards {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px, 1fr)
        );

    gap: 15px;
}

.card {
    padding: 22px;

    background: #111;

    border: 1px solid #222;

    border-radius: 15px;
}

.card h3 {
    margin-bottom: 8px;
}

.card p {
    color: #777;

    font-size: 14px;

    line-height: 1.5;

    margin-bottom: 15px;
}


/* =====================================================
   CHAT
   ===================================================== */

.chat {
    height: calc(100vh - 140px);

    display: flex;
    flex-direction: column;

    background: #0d0d0d;

    border: 1px solid #222;

    border-radius: 15px;

    overflow: hidden;
}

.chat-header {
    padding: 18px;

    border-bottom: 1px solid #222;
}

.chat-header small {
    color: #666;
}

.messages {
    flex: 1;

    overflow-y: auto;

    padding: 20px;
}

.message {
    margin-bottom: 15px;
}

.message strong {
    color: #e50914;
}

.message span {
    color: #bbb;
}

.chat-input {
    display: flex;

    gap: 10px;

    padding: 15px;

    border-top: 1px solid #222;
}

.chat-input input {
    flex: 1;

    padding: 13px;

    background: #080808;

    border: 1px solid #333;

    border-radius: 9px;

    color: white;
}


/* =====================================================
   MODAL
   ===================================================== */

.modal {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.75);

    z-index: 100;
}

.modal-box {
    width: min(500px, 90%);

    padding: 30px;

    background: #111;

    border: 1px solid #333;

    border-radius: 18px;
}

.modal-box h2 {
    margin-bottom: 10px;
}

.modal-box p {
    color: #888;

    line-height: 1.5;

    margin-bottom: 20px;
}

.code-box {
    padding: 15px;

    background: #050505;

    border: 1px solid #333;

    border-radius: 10px;

    word-break: break-all;

    color: #e50914;

    font-family: monospace;

    margin-bottom: 15px;
}

.modal-actions {
    display: flex;

    gap: 10px;

    flex-wrap: wrap;
}

.modal-actions button {
    flex: 1;
}


/* =====================================================
   RESPONSIVO
   ===================================================== */

@media (max-width: 750px) {

    .sidebar {
        display: none;
    }

    .topbar {
        padding: 0 15px;
    }

    .top-nav {
        display: none;
    }

    .content {
        padding: 20px;
    }

    .hero h1 {
        font-size: 28px;
    }

}

</style>

</head>

<body>


<!-- =====================================================
     CONFIGURAÇÃO
     ===================================================== -->

<section id="setup">

    <div class="setup-box">

        <div class="logo-big">
            D2
        </div>

        <h1>
            Bem-vindo ao D2
        </h1>

        <p>
            Escolha o nome que seus amigos
            verão no aplicativo.
        </p>

        <input
            id="nameInput"
            type="text"
            maxlength="20"
            placeholder="Seu nome"
        >

        <button
            class="primary"
            onclick="startD2()"
        >
            Entrar no D2
        </button>

    </div>

</section>


<!-- =====================================================
     APLICATIVO
     ===================================================== -->

<div id="app">

    <header class="topbar">

        <div class="logo">
            D2
        </div>

        <nav class="top-nav">

            <button
                class="active"
                onclick="home()"
            >
                Início
            </button>

            <button
                onclick="friendsPage()"
            >
                Amigos
            </button>

        </nav>

        <div class="profile">

            <span class="status"></span>

            <span id="profileName">
                Usuário
            </span>

        </div>

    </header>


    <div class="layout">


        <!-- =================================================
             SIDEBAR
             ================================================= -->

        <aside class="sidebar">

            <div class="sidebar-title">
                MENU
            </div>

            <button onclick="home()">
                🏠 Início
            </button>

            <button onclick="friendsPage()">
                👥 Amigos
            </button>

            <button onclick="createInvite()">
                ➕ Adicionar amigo
            </button>

            <button onclick="joinInvite()">
                🔗 Usar convite
            </button>


            <div class="sidebar-title">
                AMIGOS
            </div>

            <div id="friendsList">
                <p
                    style="
                        color:#555;
                        font-size:13px;
                        padding:10px;
                    "
                >
                    Nenhum amigo ainda.
                </p>
            </div>

        </aside>


        <!-- =================================================
             CONTEÚDO
             ================================================= -->

        <main
            class="content"
            id="content"
        >

        </main>

    </div>

</div>


<!-- =====================================================
     MODAL
     ===================================================== -->

<div
    id="modal"
    class="modal"
>

    <div class="modal-box">

        <h2 id="modalTitle">
            D2
        </h2>

        <p id="modalDescription">
            D2
        </p>

        <div
            id="modalContent"
        ></div>

        <div
            class="modal-actions"
            id="modalActions"
        ></div>

    </div>

</div>


<script>

/* =====================================================
   D2 — DADOS
   ===================================================== */

let username =
    localStorage.getItem(
        "d2_username"
    );

let friends =
    JSON.parse(
        localStorage.getItem(
            "d2_friends"
        ) || "[]"
    );


/* =====================================================
   INICIAR
   ===================================================== */

function startD2() {

    const input =
        document.getElementById(
            "nameInput"
        );

    const name =
        input.value.trim();


    if (!name) {

        alert(
            "Digite um nome primeiro."
        );

        return;

    }


    username = name;


    localStorage.setItem(
        "d2_username",
        username
    );


    document.getElementById(
        "setup"
    ).style.display = "none";


    document.getElementById(
        "app"
    ).style.display = "block";


    document.getElementById(
        "profileName"
    ).textContent =
        username;


    renderFriends();

    home();

}


/* =====================================================
   VERIFICAR LOGIN
   ===================================================== */

window.addEventListener(
    "load",
    () => {

        if (username) {

            document.getElementById(
                "setup"
            ).style.display = "none";


            document.getElementById(
                "app"
            ).style.display = "block";


            document.getElementById(
                "profileName"
            ).textContent =
                username;


            renderFriends();

            home();

        }

    }
);


/* =====================================================
   PÁGINA INICIAL
   ===================================================== */

function home() {

    document.getElementById(
        "content"
    ).innerHTML = `

        <section class="hero">

            <h1>
                Olá, ${escapeHTML(username)} 👋
            </h1>

            <p>
                Seu espaço privado para conversar
                e ficar em chamada com seus amigos.
            </p>


            <div class="cards">

                <div class="card">

                    <h3>
                        👥 Amigos
                    </h3>

                    <p>
                        Adicione seus amigos através
                        de um convite.
                    </p>

                    <button
                        class="primary"
                        onclick="friendsPage()"
                    >
                        Ver amigos
                    </button>

                </div>


                <div class="card">

                    <h3>
                        🔗 Convite
                    </h3>

                    <p>
                        Gere uma identidade de convite
                        para compartilhar com seu amigo.
                    </p>

                    <button
                        class="secondary"
                        onclick="createInvite()"
                    >
                        Criar convite
                    </button>

                </div>


                <div class="card">

                    <h3>
                        🖥️ Compartilhar tela
                    </h3>

                    <p>
                        A função de compartilhamento
                        de tela será feita usando WebRTC.
                    </p>

                    <button
                        class="secondary"
                        onclick="testScreenShare()"
                    >
                        Testar tela
                    </button>

                </div>

            </div>

        </section>

    `;

}


/* =====================================================
   AMIGOS
   ===================================================== */

function friendsPage() {

    let html = `

        <section class="hero">

            <h1>
                Amigos
            </h1>

            <p>
                Seus amigos salvos neste dispositivo.
            </p>

    `;


    if (
        friends.length === 0
    ) {

        html += `

            <div class="card">

                <h3>
                    Você ainda não tem amigos.
                </h3>

                <p>
                    Gere um convite ou use o convite
                    recebido pelo seu amigo.
                </p>

                <button
                    class="primary"
                    onclick="createInvite()"
                >
                    Adicionar amigo
                </button>

            </div>

        `;

    } else {

        friends.forEach(
            (friend, index) => {

                html += `

                    <div
                        class="card"
                        style="margin-bottom:10px;"
                    >

                        <div
                            style="
                                display:flex;
                                align-items:center;
                                gap:12px;
                            "
                        >

                            <div class="avatar">
                                ${escapeHTML(
                                    friend.name
                                    .charAt(0)
                                    .toUpperCase()
                                )}
                            </div>

                            <div>

                                <strong>
                                    ${escapeHTML(
                                        friend.name
                                    )}
                                </strong>

                                <p>
                                    Amigo D2
                                </p>

                            </div>

                        </div>


                        <br>


                        <button
                            class="primary"
                            onclick="openChat(${index})"
                        >
                            Abrir conversa
                        </button>

                    </div>

                `;

            }
        );

    }


    html += `</section>`;


    document.getElementById(
        "content"
    ).innerHTML =
        html;

}


/* =====================================================
   LISTA LATERAL
   ===================================================== */

function renderFriends() {

    const list =
        document.getElementById(
            "friendsList"
        );


    if (
        friends.length === 0
    ) {

        list.innerHTML = `

            <p
                style="
                    color:#555;
                    font-size:13px;
                    padding:10px;
                "
            >
                Nenhum amigo ainda.
            </p>

        `;

        return;

    }


    list.innerHTML =
        friends
            .map(
                (friend, index) => `

                    <div
                        class="friend"
                        onclick="openChat(${index})"
                    >

                        <div class="avatar">

                            ${escapeHTML(
                                friend.name
                                    .charAt(0)
                                    .toUpperCase()
                            )}

                        </div>

                        <span>
                            ${escapeHTML(
                                friend.name
                            )}
                        </span>

                    </div>

                `
            )
            .join("");

}


/* =====================================================
   CRIAR CONVITE
   ===================================================== */

function createInvite() {

    const identity =
        createRandomID();


    const invite = {

        type: "D2_INVITE",

        version: 1,

        name: username,

        id: identity,

        created:
            Date.now()

    };


    const encoded =
        btoa(
            JSON.stringify(
                invite
            )
        );


    showModal(

        "Seu convite D2",

        `
            Envie este código para seu amigo.

            <br><br>

            Ele poderá colar o código
            no D2 dele.

            <br><br>

            <b>
                O convite serve para
                apresentar um usuário ao outro.
            </b>
        `,

        `

            <div class="code-box">
                ${encoded}
            </div>

        `,

        [

            {
                text: "📋 Copiar",

                action: () => {

                    navigator.clipboard
                        .writeText(
                            encoded
                        );

                    alert(
                        "Convite copiado!"
                    );

                }

            },

            {
                text: "Fechar",

                action: closeModal

            }

        ]

    );

}


/* =====================================================
   USAR CONVITE
   ===================================================== */

function joinInvite() {

    showModal(

        "Adicionar amigo",

        `
            Cole aqui o convite
            que seu amigo enviou.
        `,

        `

            <input
                id="inviteInput"
                placeholder="Cole o código aqui"
                style="
                    width:100%;
                    padding:14px;
                    background:#080808;
                    border:1px solid #333;
                    border-radius:9px;
                    color:white;
                    margin-bottom:15px;
                "
            >

        `,

        [

            {

                text: "Adicionar",

                action: () => {

                    const value =
                        document
                            .getElementById(
                                "inviteInput"
                            )
                            .value
                            .trim();


                    if (!value) {

                        alert(
                            "Cole um convite."
                        );

                        return;

                    }


                    try {

                        const invite =
                            JSON.parse(
                                atob(value)
                            );


                        if (
                            invite.type !==
                            "D2_INVITE"
                        ) {

                            throw new Error();

                        }


                        addFriend(
                            invite
                        );


                        closeModal();


                        alert(
                            "Amigo adicionado! 👥"
                        );

                    } catch {

                        alert(
                            "Esse convite não é válido."
                        );

                    }

                }

            },

            {

                text: "Cancelar",

                action: closeModal

            }

        ]

    );

}


/* =====================================================
   ADICIONAR AMIGO
   ===================================================== */

function addFriend(
    invite
) {

    const exists =
        friends.some(
            friend =>
                friend.id ===
                invite.id
        );


    if (exists) {

        return;

    }


    friends.push({

        id: invite.id,

        name: invite.name,

        added:
            Date.now()

    });


    localStorage.setItem(
        "d2_friends",
        JSON.stringify(
            friends
        )
    );


    renderFriends();

    friendsPage();

}


/* =====================================================
   CHAT LOCAL
   ===================================================== */

function openChat(
    friendIndex
) {

    const friend =
        friends[friendIndex];


    const key =
        "d2_chat_" +
        friend.id;


    let messages =
        JSON.parse(
            localStorage.getItem(
                key
            ) || "[]"
        );


    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="chat">

            <div class="chat-header">

                <strong>
                    ${escapeHTML(
                        friend.name
                    )}
                </strong>

                <br>

                <small>
                    Amigo D2
                </small>

            </div>


            <div
                class="messages"
                id="messages"
            >

                ${renderMessages(
                    messages
                )}

            </div>


            <div class="chat-input">

                <input
                    id="chatMessage"
                    placeholder="Digite uma mensagem..."
                    onkeydown="
                        if(event.key === 'Enter')
                            sendMessage(${friendIndex})
                    "
                >

                <button
                    class="primary"
                    style="width:auto;"
                    onclick="
                        sendMessage(${friendIndex})
                    "
                >
                    Enviar
                </button>

            </div>

        </div>

    `;


    const messagesBox =
        document.getElementById(
            "messages"
        );


    messagesBox.scrollTop =
        messagesBox.scrollHeight;

}


/* =====================================================
   ENVIAR MENSAGEM
   ===================================================== */

function sendMessage(
    friendIndex
) {

    const input =
        document.getElementById(
            "chatMessage"
        );


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    const friend =
        friends[friendIndex];


    const key =
        "d2_chat_" +
        friend.id;


    let messages =
        JSON.parse(
            localStorage.getItem(
                key
            ) || "[]"
        );


    messages.push({

        sender:
            username,

        text:
            text,

        time:
            Date.now()

    });


    // =================================================
    // MENSAGENS COM MAIS DE 24 HORAS SÃO APAGADAS
    // =================================================

    const limit =
        Date.now()
        -
        (
            24 *
            60 *
            60 *
            1000
        );


    messages =
        messages.filter(
            message =>
                message.time >
                limit
        );


    localStorage.setItem(
        key,
        JSON.stringify(
            messages
        )
    );


    input.value = "";


    openChat(
        friendIndex
    );

}


/* =====================================================
   RENDERIZAR MENSAGENS
   ===================================================== */

function renderMessages(
    messages
) {

    if (
        messages.length === 0
    ) {

        return `

            <p
                style="
                    color:#555;
                "
            >
                Nenhuma mensagem ainda.
            </p>

        `;

    }


    return messages
        .map(
            message => `

                <div class="message">

                    <strong>
                        ${escapeHTML(
                            message.sender
                        )}
                    </strong>

                    <span>
                        ${escapeHTML(
                            message.text
                        )}
                    </span>

                </div>

            `
        )
        .join("");

}


/* =====================================================
   TESTAR COMPARTILHAMENTO DE TELA
   ===================================================== */

async function testScreenShare() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices
            .getDisplayMedia
    ) {

        alert(
            "Seu navegador não suporta compartilhamento de tela."
        );

        return;

    }


    try {

        const stream =
            await navigator
                .mediaDevices
                .getDisplayMedia({

                    video: true,

                    audio: true

                });


        const video =
            document.createElement(
                "video"
            );


        video.autoplay = true;

        video.muted = true;

        video.srcObject =
            stream;


        video.style =
            `
                position:fixed;
                right:20px;
                bottom:20px;
                width:320px;
                max-height:200px;
                background:black;
                border:2px solid #e50914;
                border-radius:12px;
                z-index:999;
            `;


        document.body.appendChild(
            video
        );


        stream
            .getVideoTracks()[0]
            .addEventListener(
                "ended",
                () => {

                    video.remove();

                }
            );


    } catch {

        console.log(
            "Compartilhamento cancelado."
        );

    }

}


/* =====================================================
   MODAL
   ===================================================== */

function showModal(
    title,
    description,
    content,
    actions
) {

    document.getElementById(
        "modalTitle"
    ).textContent =
        title;


    document.getElementById(
        "modalDescription"
    ).innerHTML =
        description;


    document.getElementById(
        "modalContent"
    ).innerHTML =
        content;


    const actionsBox =
        document.getElementById(
            "modalActions"
        );


    actionsBox.innerHTML = "";


    actions.forEach(
        action => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "secondary";


            button.textContent =
                action.text;


            button.onclick =
                action.action;


            actionsBox.appendChild(
                button
            );

        }
    );


    document.getElementById(
        "modal"
    ).style.display =
        "flex";

}


function closeModal() {

    document.getElementById(
        "modal"
    ).style.display =
        "none";

}


/* =====================================================
   ID ALEATÓRIO
   ===================================================== */

function createRandomID() {

    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    let result =
        "";


    for (
        let i = 0;
        i < 16;
        i++
    ) {

        result +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];

    }


    return result;

}


/* =====================================================
   SEGURANÇA BÁSICA PARA TEXTO
   ===================================================== */

function escapeHTML(
    text
) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   FECHAR MODAL CLICANDO FORA
   ===================================================== */

document
    .getElementById("modal")
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "modal"
            ) {

                closeModal();

            }

        }
    );


</script>
